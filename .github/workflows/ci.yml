name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Audit dependencies
        run: bun run audit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test generated site
        run: bun run smoke

      - name: Upload verified site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install locked deployment tooling
        run: bun install --frozen-lockfile

      - name: Download verified site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-${{ github.sha }}
          path: dist

      - name: Prepare isolated preview configuration
        run: >-
          jq '{hosting: ((.hosting | {headers, cleanUrls, trailingSlash}) +
          {site: "themarchermann-preview", public: "dist"})}'
          firebase.json > firebase.preview.json

      - name: Authenticate to isolated preview project
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/415482766113/locations/global/workloadIdentityPools/github-preview/providers/github-preview
          service_account: github-preview-deployer@themarchermann-preview.iam.gserviceaccount.com

      - name: Deploy preview channel
        run: >-
          ./node_modules/.bin/firebase hosting:channel:deploy
          pr-${{ github.event.pull_request.number }}
          --config firebase.preview.json
          --project themarchermann-preview
          --expires 7d
          --non-interactive

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install locked deployment tooling
        run: bun install --frozen-lockfile

      - name: Download verified site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-${{ github.sha }}
          path: dist

      - name: Authenticate to production
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/958725563449/locations/global/workloadIdentityPools/github-production/providers/github-production
          service_account: github-production-deployer@themarchermann-site.iam.gserviceaccount.com

      - name: Deploy live channel
        run: >-
          ./node_modules/.bin/firebase deploy
          --only hosting
          --project themarchermann-site
          --non-interactive

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install release tooling
        run: >-
          bun install --frozen-lockfile --production
          --filter @themarchermann/release

      - name: Release deployed revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun --cwd .github/release run release
